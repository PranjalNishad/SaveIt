services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      # Cookies optional — primary YouTube path needs none.
      YOUTUBE_COOKIES_FILE: /app/cookies/youtube_cookies.txt
      INSTAGRAM_COOKIES_FILE: /app/cookies/instagram_cookies.txt
      # Optional self-hosted Cobalt fallback:
      # COBALT_API_KEY: ""
      # COBALT_INSTANCES: ""
      # Override yt-dlp YouTube clients if a new one is needed:
      # YTDLP_YT_CLIENTS: "tv_embedded,default,web_safari"
    volumes:
      # Drop cookie files here to refresh them WITHOUT rebuilding the image.
      # Safe to leave empty — downloads still work without cookies.
      # Make the mount writable so yt-dlp can save cookie updates.
      - ./cookies:/app/cookies:rw
    ports:
      # Exposes the supervisor's readiness endpoint (200 = Redis reachable, 503 = not).
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Give in-flight downloads time to finish on stop (must exceed the
    # supervisor's SHUTDOWN_GRACE_MS, default 60s).
    stop_grace_period: 90s
    healthcheck:
      # curl is installed in the image; -f makes 503 (Redis down) a failure.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
